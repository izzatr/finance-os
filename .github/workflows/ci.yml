name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: finance_os_test
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://finance:finance@localhost:5432/finance_os_test
      DATABASE_URL: postgres://finance:finance@localhost:5432/finance_os_test
      BETTER_AUTH_SECRET: test-secret-for-ci-only-min-32-chars
      BETTER_AUTH_URL: http://localhost:27032
      WEB_ORIGIN: http://localhost:27031
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace @finance-os/web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -t finance-os-api:ci -f apps/api/Dockerfile .
      - name: Smoke-test API image (migrations + readiness)
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke -e POSTGRES_USER=finance -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=finance_os postgres:16-alpine
          for i in $(seq 30); do docker exec smoke-db pg_isready -U finance -d finance_os && break; sleep 1; done
          docker run -d --name smoke-api --network smoke \
            -e NODE_ENV=production -e PORT=27032 \
            -e DATABASE_URL=postgres://finance:smoke@smoke-db:5432/finance_os \
            -e BETTER_AUTH_SECRET=smoke-test-secret-that-is-long-enough-0123 \
            -e BETTER_AUTH_URL=https://api.example.test -e WEB_ORIGIN=https://app.example.test \
            finance-os-api:ci
          for i in $(seq 60); do
            if docker exec smoke-api node -e "fetch('http://127.0.0.1:27032/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "API image migrated and is ready"; exit 0
            fi
            sleep 2
          done
          docker logs smoke-api; exit 1
      - name: Build web image
        run: docker build -f apps/web/Dockerfile --build-arg VITE_API_BASE_URL=/ .
